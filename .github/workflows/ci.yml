name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # vitest 5 needs Node >= 22.12, so the test suite only runs here.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Self-scan
        run: node dist/cli.js . --ignore "tests/**"
      # Catch version/mcpName drift on every PR rather than at tag time.
      - name: Verify release metadata
        run: node scripts/verify-release.cjs

  # package.json still promises Node >= 18 at runtime, but the test runner no longer
  # runs on 18 or 20. These legs build and self-scan instead: the self-scan runs the
  # built CLI over this repo, which exercises the scanner on that Node version.
  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Self-scan
        run: node dist/cli.js . --ignore "tests/**"

  # master's branch protection requires a check named exactly "build". A matrix job
  # can't produce one (it emits "build-and-test (22)" and friends), so this aggregator
  # supplies it and passes only when every leg of both matrix jobs succeeded. Without
  # it, no PR is mergeable without an admin override.
  build:
    runs-on: ubuntu-latest
    needs: [build-and-test, build-and-scan]
    if: always()
    steps:
      - name: Require all matrix jobs to have succeeded
        run: |
          echo "build-and-test result: ${{ needs.build-and-test.result }}"
          echo "build-and-scan result: ${{ needs.build-and-scan.result }}"
          test "${{ needs.build-and-test.result }}" = "success"
          test "${{ needs.build-and-scan.result }}" = "success"

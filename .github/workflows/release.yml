name: Release

on:
  push:
    tags: ['v*']

# Least privilege by default; the publish job widens what it needs.
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the rolling v1 tag
      id-token: write # OIDC: npm trusted publishing + provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 24 still ships npm 10.x.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # Catches the release footguns that have bitten this repo before: a tag that
      # disagrees with package.json, and an mcpName/server.json mismatch, which the
      # MCP registry rejects with a 400 only *after* npm has already been published
      # (and npm versions are immutable, so that costs a version bump to undo).
      - name: Verify version + MCP name consistency
        run: node scripts/verify-release.cjs "${GITHUB_REF_NAME}"

      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Self-scan
        run: node dist/cli.js . --ignore "tests/**"

      # No NODE_AUTH_TOKEN: auth comes from the OIDC identity configured as a
      # trusted publisher on npmjs.com. Provenance is attested automatically.
      - name: Publish prodlint to npm
        run: npm publish --provenance --access public

      # Published second so its `prodlint` dependency already exists on the registry.
      # Keeping it in this workflow is what stops it drifting from the scanner again.
      - name: Publish prodlint-mcp launcher to npm
        run: npm publish ./packages/prodlint-mcp --provenance --access public

      # Registry auth is OIDC too, so this needs no stored credential. Previously this
      # step was manual and awkward: mcp-publisher's registry JWT expires within
      # minutes of an interactive `login github`.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Update rolling v1 tag
        run: |
          git tag -f v1
          git push origin v1 --force

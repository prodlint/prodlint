name: Release

on:
  push:
    # Release tags only. The rolling v1 tag also matches v*, and pushing it by hand
    # used to start a release run that could only fail.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # Resumes a release that failed after npm (MCP registry, v1 tag): run it from master
  # with the release tag. Versions already on npm are skipped, so nothing publishes twice.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to resume, e.g. v0.10.2 (v1 moves to it)
        required: true
        type: string

# Least privilege by default; each job widens only what it needs.
permissions: {}

# The tag being released, under either trigger. Steps read it from the environment
# rather than interpolating it into scripts, since a dispatch input is free text.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Everything that runs third-party code (npm ci's install scripts, the build, the test
  # suite) happens here, with a read-only token and no OIDC. The publish job only ever
  # sees the packed tarballs, so a compromised dev dependency can't mint the npm
  # trusted-publishing token or push to the repo.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Before any checkout: a dispatch input could name a branch or someone's PR ref.
      - name: Check the release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The tag must look like vX.Y.Z." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Catches the release footguns that have bitten this repo before: a tag that
      # disagrees with package.json, and an mcpName/server.json mismatch, which the
      # MCP registry rejects with a 400 only *after* npm has already been published
      # (and npm versions are immutable, so that costs a version bump to undo).
      - name: Verify version + MCP name consistency
        run: node scripts/verify-release.cjs "$RELEASE_TAG"

      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Self-scan
        run: node dist/cli.js . --ignore "tests/**"

      - name: Pack prodlint and the prodlint-mcp launcher
        run: |
          mkdir release
          npm pack --pack-destination release
          npm pack ./packages/prodlint-mcp --pack-destination release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarballs
          path: release/*.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: npm trusted publishing + provenance, MCP registry login
    steps:
      # Only for server.json, which mcp-publisher reads. No code from the repo runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 24 still ships npm 10.x.
      # Pinned rather than @latest: this job can publish, so it shouldn't pick up whatever
      # npm release (or major) landed that morning.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@11.21.0
          npm --version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarballs
          path: release

      # No NODE_AUTH_TOKEN: auth comes from the OIDC identity configured as a
      # trusted publisher on npmjs.com. Provenance is attested automatically.
      # Publishing a tarball runs none of the package's lifecycle scripts.
      # Keep the leading ./ on the tarball paths: npm reads a bare "release/x.tgz" as
      # the GitHub repo release/x.tgz, which is why 0.10.1 never reached npm.
      # A version that's already on npm is skipped, so a resumed release gets past these
      # steps instead of failing on npm's refusal to republish it.
      - name: Publish prodlint to npm
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [ "$(npm view "prodlint@${VERSION}" version 2>/dev/null)" = "${VERSION}" ]; then
            echo "prodlint@${VERSION} is already on npm; skipping."
          else
            npm publish "./release/prodlint-${VERSION}.tgz" --provenance --access public
          fi

      # Published second so its `prodlint` dependency already exists on the registry.
      # Keeping it in this workflow is what stops it drifting from the scanner again.
      - name: Publish prodlint-mcp launcher to npm
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [ "$(npm view "prodlint-mcp@${VERSION}" version 2>/dev/null)" = "${VERSION}" ]; then
            echo "prodlint-mcp@${VERSION} is already on npm; skipping."
          else
            npm publish "./release/prodlint-mcp-${VERSION}.tgz" --provenance --access public
          fi

      # Registry auth is OIDC too, so this needs no stored credential. Previously this
      # step was manual and awkward: mcp-publisher's registry JWT expires within
      # minutes of an interactive `login github`.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      # npm keeps processing a new version for a few minutes after `npm publish`
      # returns, and the registry rejects the publish until it can fetch
      # prodlint-mcp@VERSION from npm; that's what failed 0.10.2's first run. Wait for
      # npm to serve it, then retry a few times for CDN lag.
      - name: Publish to MCP Registry
        run: |
          VERSION="${RELEASE_TAG#v}"
          for i in $(seq 1 30); do
            if [ "$(npm view "prodlint-mcp@${VERSION}" version 2>/dev/null)" = "${VERSION}" ]; then
              break
            fi
            echo "prodlint-mcp@${VERSION} isn't served by npm yet ($i/30); waiting 10s."
            sleep 10
          done
          for attempt in 1 2 3 4 5; do
            if ./mcp-publisher login github-oidc && ./mcp-publisher publish; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "MCP registry publish failed ($attempt/5); retrying in 30s."
              sleep 30
            fi
          done
          exit 1

  # The only job that can write to the repo, and it runs nothing but git.
  update-v1-tag:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the rolling v1 tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Update rolling v1 tag
        run: |
          git tag -f v1
          git push origin v1 --force

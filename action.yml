name: 'Prodlint'
description: 'Production readiness for vibe-coded apps — check your AI code before you ship'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  path:
    description: 'Path to scan (default: current directory)'
    required: false
    default: '.'
  threshold:
    description: 'Minimum score to pass (0-100). Fails the check if score is below this.'
    required: false
    default: '0'
  fail-on-critical:
    description: 'Fail the check when the scan finds critical issues (true/false)'
    required: false
    default: 'true'
  ignore:
    description: 'Glob patterns to ignore (comma-separated)'
    required: false
    default: ''
  comment:
    description: 'Post a PR comment with results (true/false)'
    required: false
    default: 'true'

outputs:
  score:
    description: 'Overall prodlint score (0-100)'
    value: ${{ steps.scan.outputs.score }}
  critical:
    description: 'Number of critical findings'
    value: ${{ steps.scan.outputs.critical }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        # Automatic caching would key off the scanned repo's package.json; npx needs none.
        package-manager-cache: false

    - name: Run prodlint
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_IGNORE: ${{ inputs.ignore }}
      run: |
        CMD_ARGS=("$INPUT_PATH" "--json")
        if [ -n "$INPUT_IGNORE" ]; then
          IFS=',' read -ra PATTERNS <<< "$INPUT_IGNORE"
          for p in "${PATTERNS[@]}"; do
            trimmed=$(echo "$p" | xargs)
            CMD_ARGS+=("--ignore" "$trimmed")
          done
        fi

        # The exact release this action ships with (scripts/sync-versions.cjs bumps it), so
        # pinning the action — @v1, a version tag or a commit SHA — also pins the scanner.
        # It exits 1 when it finds criticals and 2 when the scan fails; "Check results" decides.
        EXIT_CODE=0
        npx -y prodlint@0.10.4 "${CMD_ARGS[@]}" > "$RUNNER_TEMP/prodlint-result.json" || EXIT_CODE=$?
        echo "exit-code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
        node "$GITHUB_ACTION_PATH/scripts/action-check.cjs" outputs "$RUNNER_TEMP/prodlint-result.json" >> "$GITHUB_OUTPUT"

    # Built by a script file rather than inline `node -e`: the comment carries file paths
    # and messages from the scanned repo, and the script's escaping is unit-tested.
    - name: Generate comment body
      if: inputs.comment == 'true' && github.event_name == 'pull_request' && steps.scan.outputs.scanned == 'true'
      id: comment
      shell: bash
      run: node "$GITHUB_ACTION_PATH/scripts/action-comment.cjs" "$RUNNER_TEMP/prodlint-result.json" "$RUNNER_TEMP/prodlint-comment.md"

    - name: Post PR comment
      if: inputs.comment == 'true' && github.event_name == 'pull_request' && steps.scan.outputs.scanned == 'true'
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: prodlint
        path: ${{ runner.temp }}/prodlint-comment.md

    # Fails on critical findings (unless fail-on-critical is false), on a score below
    # threshold, and when the scan didn't produce a result.
    - name: Check results
      shell: bash
      env:
        SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_FAIL_ON_CRITICAL: ${{ inputs.fail-on-critical }}
      run: node "$GITHUB_ACTION_PATH/scripts/action-check.cjs" check "$RUNNER_TEMP/prodlint-result.json"

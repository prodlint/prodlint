name: 'Prodlint'
description: 'Production readiness for vibe-coded apps — check your AI code before you ship'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  path:
    description: 'Path to scan (default: current directory)'
    required: false
    default: '.'
  threshold:
    description: 'Minimum score to pass (0-100). Fails the check if score is below this.'
    required: false
    default: '0'
  ignore:
    description: 'Glob patterns to ignore (comma-separated)'
    required: false
    default: ''
  comment:
    description: 'Post a PR comment with results (true/false)'
    required: false
    default: 'true'

outputs:
  score:
    description: 'Overall prodlint score (0-100)'
    value: ${{ steps.scan.outputs.score }}
  critical:
    description: 'Number of critical findings'
    value: ${{ steps.scan.outputs.critical }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        # Automatic caching would key off the scanned repo's package.json; npx needs none.
        package-manager-cache: false

    - name: Run prodlint
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_IGNORE: ${{ inputs.ignore }}
      run: |
        CMD_ARGS=("$INPUT_PATH" "--json")
        if [ -n "$INPUT_IGNORE" ]; then
          IFS=',' read -ra PATTERNS <<< "$INPUT_IGNORE"
          for p in "${PATTERNS[@]}"; do
            trimmed=$(echo "$p" | xargs)
            CMD_ARGS+=("--ignore" "$trimmed")
          done
        fi

        # The exact release this action ships with (scripts/sync-versions.cjs bumps it), so
        # pinning the action — @v1, a version tag or a commit SHA — also pins the scanner.
        OUTPUT=$(npx -y prodlint@0.10.2 "${CMD_ARGS[@]}" 2>&1) || true

        SCORE=$(echo "$OUTPUT" | node -e "
          const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
          console.log(Number(d.overallScore) || 0);
        " 2>/dev/null || echo "0")
        SCORE=$(echo "$SCORE" | tr -cd '0-9')

        CRITICAL=$(echo "$OUTPUT" | node -e "
          const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
          console.log(Number(d.summary.critical) || 0);
        " 2>/dev/null || echo "0")
        CRITICAL=$(echo "$CRITICAL" | tr -cd '0-9')

        echo "score=${SCORE:-0}" >> "$GITHUB_OUTPUT"
        echo "critical=${CRITICAL:-0}" >> "$GITHUB_OUTPUT"
        echo "$OUTPUT" > "$RUNNER_TEMP/prodlint-result.json"

    # Built by a script file rather than inline `node -e`: the comment carries file paths
    # and messages from the scanned repo, and the script's escaping is unit-tested.
    - name: Generate comment body
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      id: comment
      shell: bash
      run: node "$GITHUB_ACTION_PATH/scripts/action-comment.cjs" "$RUNNER_TEMP/prodlint-result.json" "$RUNNER_TEMP/prodlint-comment.md"

    - name: Post PR comment
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: prodlint
        path: ${{ runner.temp }}/prodlint-comment.md

    - name: Check threshold
      if: inputs.threshold != '0'
      shell: bash
      env:
        SCAN_SCORE: ${{ steps.scan.outputs.score }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
      run: |
        SCORE="$SCAN_SCORE"
        THRESHOLD="$INPUT_THRESHOLD"
        if [ "$SCORE" -lt "$THRESHOLD" ]; then
          echo "::error::Prodlint score ($SCORE) is below threshold ($THRESHOLD)"
          exit 1
        fi
